name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: |
          docker build -t wcrp-web:ci .

      - name: Run container (smoke test)
        run: |
          docker run -d --name wcrp-web-ci -p 127.0.0.1:8080:80 wcrp-web:ci
          # wait for container
          for i in {1..10}; do
            sleep 1
            status=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/ || true)
            if [ "$status" = "200" ]; then echo "ok"; break; fi
            echo "waiting... ($i)";
          done
          docker stop wcrp-web-ci
